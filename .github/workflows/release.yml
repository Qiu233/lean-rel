name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the package version (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: LeanRel lean-rel lean-rel-tests
          test: true

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          package_version="$(lake reservoir-config | jq -er '.version')"
          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "release tag ${RELEASE_TAG} does not match package version v${package_version}" >&2
            exit 1
          fi
          tag_object="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | cut -f1)"
          if [[ -n "${tag_object}" ]]; then
            tag_revision="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
            tag_revision="${tag_revision:-${tag_object}}"
            if [[ "${tag_revision}" != "${GITHUB_SHA}" ]]; then
              echo "release tag ${RELEASE_TAG} already points to ${tag_revision}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
            echo "release tag ${RELEASE_TAG} already points to this commit; continuing retry"
          fi

  build-archives:
    name: Build archive (${{ matrix.name }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-latest
          - name: macOS x86-64
            os: macos-15-intel
          - name: macOS ARM64
            os: macos-15
          - name: Windows x86-64
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: LeanRel
          test: false
          use-github-cache: false

      - name: Pack and verify Lake build archive
        run: |
          "$HOME/.elan/bin/lake" pack
          shopt -s nullglob
          archives=(.lake/lean-rel-*.tar.gz)
          if (( ${#archives[@]} != 1 )); then
            echo "expected exactly one Lake archive, found ${#archives[@]}" >&2
            exit 1
          fi
          tar -tzf "${archives[0]}" >/dev/null

      - name: Stage Lake build archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: .lake/lean-rel-*.tar.gz
          if-no-files-found: error
          include-hidden-files: true

  publish:
    name: Publish release
    needs: build-archives
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download Lake build archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          archives=(dist/lean-rel-*.tar.gz)
          if (( ${#archives[@]} != 4 )); then
            echo "expected four platform archives, found ${#archives[@]}" >&2
            exit 1
          fi

          # Recheck after the builds in case the remote tag changed in the meantime.
          tag_object="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | cut -f1)"
          if [[ -n "${tag_object}" ]]; then
            tag_revision="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
            tag_revision="${tag_revision:-${tag_object}}"
            if [[ "${tag_revision}" != "${GITHUB_SHA}" ]]; then
              echo "release tag ${RELEASE_TAG} already points to ${tag_revision}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "lean-rel ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${archives[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${archives[@]}" \
              --verify-tag \
              --generate-notes \
              --title "${RELEASE_TAG}"
          fi
          for archive in "${archives[@]}"; do
            asset="$(basename "${archive}")"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset}"
            curl --fail --head --location --retry 5 --retry-all-errors "${url}"
            echo "- ${url}" >> "${GITHUB_STEP_SUMMARY}"
          done
